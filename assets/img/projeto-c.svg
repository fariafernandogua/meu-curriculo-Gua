<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ilustração da calculadora de portagem desenvolvida em C</title>
  <desc id="desc">Mockup estilizado de um terminal exibindo um programa em C, com uma cabine de portagem, um carro e o cálculo do valor a pagar.</desc>

  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="roadC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="softC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgC)" rx="24"/>
  <circle cx="700" cy="90" r="60" fill="#C7D2FE" opacity="0.5"/>
  <circle cx="90" cy="430" r="70" fill="#A5B4FC" opacity="0.35"/>
  <rect x="60" y="60" width="80" height="80" rx="18" fill="#FBCFE8" opacity="0.5" transform="rotate(-14 100 100)"/>

  <g filter="url(#softC)">
    <rect x="90" y="80" width="620" height="360" rx="18" fill="#FFFFFF"/>

    <rect x="90" y="80" width="620" height="44" rx="18" fill="#0F172A"/>
    <rect x="90" y="106" width="620" height="18" fill="#0F172A"/>
    <circle cx="118" cy="102" r="6" fill="#FCA5A5"/>
    <circle cx="140" cy="102" r="6" fill="#FCD34D"/>
    <circle cx="162" cy="102" r="6" fill="#86EFAC"/>
    <text x="330" y="108" font-family="monospace" font-size="14" fill="#94A3B8">portagem.c</text>

    <rect x="126" y="150" width="548" height="150" rx="10" fill="#0F172A"/>
    <text x="146" y="180" font-family="monospace" font-size="15" fill="#22D3EE">#include &lt;stdio.h&gt;</text>
    <text x="146" y="204" font-family="monospace" font-size="15" fill="#E2E8F0">float calcularPortagem(float km) {</text>
    <text x="166" y="228" font-family="monospace" font-size="15" fill="#FBBF24">return km * 0.12;</text>
    <text x="146" y="252" font-family="monospace" font-size="15" fill="#E2E8F0">}</text>
    <text x="146" y="278" font-family="monospace" font-size="15" fill="#86EFAC">// Total a pagar: 4.80€_</text>

    <rect x="126" y="318" width="200" height="90" rx="12" fill="url(#roadC)"/>
    <rect x="126" y="318" width="200" height="90" rx="12" fill="none"/>
    <rect x="130" y="358" width="192" height="10" fill="#FACC15" opacity="0.9"/>
    <rect x="150" y="358" width="18" height="10" fill="#0F172A"/>
    <rect x="190" y="358" width="18" height="10" fill="#0F172A"/>
    <rect x="230" y="358" width="18" height="10" fill="#0F172A"/>
    <rect x="270" y="358" width="18" height="10" fill="#0F172A"/>

    <rect x="150" y="330" width="34" height="60" rx="6" fill="url(#accentC)"/>
    <rect x="270" y="330" width="34" height="60" rx="6" fill="url(#accentC)"/>
    <rect x="150" y="322" width="154" height="16" rx="4" fill="#818CF8"/>

    <g transform="translate(200 372)">
      <rect x="0" y="0" width="70" height="26" rx="8" fill="#F472B6"/>
      <circle cx="14" cy="26" r="8" fill="#1E293B"/>
      <circle cx="56" cy="26" r="8" fill="#1E293B"/>
      <rect x="8" y="-10" width="30" height="14" rx="4" fill="#F472B6"/>
    </g>

    <rect x="360" y="318" width="290" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="380" y="345" font-family="sans-serif" font-size="14" fill="#64748B">Valor a pagar</text>
    <text x="380" y="382" font-family="sans-serif" font-size="30" font-weight="700" fill="#312E81">4,80 €</text>
  </g>
</svg>

<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ilustração do sistema de marcação de atendimento no porto em C++</title>
  <desc id="desc">Mockup estilizado de um terminal exibindo um programa em C++, com um navio no cais e uma lista de marcações de atendimento.</desc>

  <defs>
    <linearGradient id="bgCpp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="accentCpp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="waterCpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="softCpp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgCpp)" rx="24"/>
  <circle cx="110" cy="100" r="55" fill="#C7D2FE" opacity="0.5"/>
  <circle cx="710" cy="420" r="65" fill="#A5B4FC" opacity="0.35"/>
  <rect x="620" y="70" width="80" height="80" rx="18" fill="#FBCFE8" opacity="0.5" transform="rotate(12 660 110)"/>

  <g filter="url(#softCpp)">
    <rect x="90" y="80" width="620" height="360" rx="18" fill="#FFFFFF"/>

    <rect x="90" y="80" width="620" height="44" rx="18" fill="#0F172A"/>
    <rect x="90" y="106" width="620" height="18" fill="#0F172A"/>
    <circle cx="118" cy="102" r="6" fill="#FCA5A5"/>
    <circle cx="140" cy="102" r="6" fill="#FCD34D"/>
    <circle cx="162" cy="102" r="6" fill="#86EFAC"/>
    <text x="330" y="108" font-family="monospace" font-size="14" fill="#94A3B8">marcacao_porto.cpp</text>

    <rect x="126" y="150" width="290" height="150" rx="10" fill="#0F172A"/>
    <text x="146" y="178" font-family="monospace" font-size="14" fill="#22D3EE">class Marcacao {</text>
    <text x="166" y="200" font-family="monospace" font-size="14" fill="#E2E8F0">string cais;</text>
    <text x="166" y="222" font-family="monospace" font-size="14" fill="#E2E8F0">string hora;</text>
    <text x="146" y="244" font-family="monospace" font-size="14" fill="#E2E8F0">};</text>
    <text x="146" y="270" font-family="monospace" font-size="14" fill="#86EFAC">std::vector&lt;Marcacao&gt; fila;_</text>

    <rect x="436" y="150" width="214" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="454" y="176" font-family="sans-serif" font-size="14" font-weight="700" fill="#312E81">Atendimentos</text>
    <circle cx="462" cy="200" r="5" fill="#22D3EE"/>
    <rect x="474" y="194" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="462" cy="226" r="5" fill="#8B5CF6"/>
    <rect x="474" y="220" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="462" cy="252" r="5" fill="#F472B6"/>
    <rect x="474" y="246" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="462" cy="278" r="5" fill="#FBBF24"/>
    <rect x="474" y="272" width="110" height="10" rx="5" fill="#CBD5E1"/>

    <rect x="126" y="330" width="524" height="78" rx="14" fill="url(#waterCpp)" opacity="0.18"/>

    <g transform="translate(180 322)">
      <path d="M0 60 h280 l-20 30 h-240 z" fill="url(#accentCpp)"/>
      <rect x="40" y="18" width="200" height="42" rx="6" fill="#312E81"/>
      <rect x="60" y="0" width="16" height="24" fill="#E2E8F0"/>
      <rect x="100" y="0" width="16" height="24" fill="#E2E8F0"/>
      <rect x="140" y="0" width="16" height="24" fill="#E2E8F0"/>
      <rect x="180" y="-16" width="6" height="40" fill="#94A3B8"/>
      <rect x="186" y="-16" width="26" height="16" fill="#F472B6"/>
    </g>

    <rect x="560" y="352" width="90" height="36" rx="18" fill="url(#accentCpp)"/>
    <text x="577" y="375" font-family="sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Marcar</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Faria Fernando Gua Joaquim</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/responsivo.css">   
</head>
<body>
    <header>
        <div class="container topo">
            <a class="marca" href="index.html">
                <img src="assets/img/perfil.jpeg" alt="Fotografia de Faria Fernando Gua Joaquim">
                <span>Faria Fernando Gua Joaquim</span>
            </a>

            <nav class="menu" aria-label="Menu principal">
                <a class="" href="index.html">Home</a>
                <a class="" href="about.html">Sobre / CV</a>
                <a class="" href="portfolio.html">Portfólio</a>
                <a class="" href="hobbies.html">Hobbies</a>
                <a class="active" href="contact.html">Contacto</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="secao container">
            <h1 class="titulo">Contacto</h1>
            <form action="mailto:fariafernandoguajoaquim@gmail.com" method="post" enctype="text/plain">
                <fieldset>
                    <legend>Dados do contacto</legend>
                    <div class="form-grid duas">
                        <div class="campo">
                            <label for="nome">Nome completo *</label>
                            <input id="nome" name="nome" type="text" required minlength="3" maxlength="80">
                        </div>
                        <div class="campo">
                            <label for="email">E-mail *</label>
                            <input id="email" name="email" type="email" required>
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input id="telefone" name="telefone" type="tel" required pattern="[0-9 +()-]{9,20}">
                        </div>
                        <div class="campo">
                            <label for="data">Data preferida *</label>
                            <input id="data" name="data" type="date" required>
                        </div>
                        <div class="campo">
                            <label for="numero">Número *</label>
                            <input id="numero" name="numero" type="number" min="1" max="999" required>
                        </div>
                        <div class="campo">
                            <label for="assunto">Assunto *</label>
                                <select id="assunto" name="assunto" required>
                                    <option value="">Selecione</option>
                                    <option>Projeto Web</option>
                                    <option>Programação</option>
                                    <option>Oportunidade profissional</option>
                                </select>
</body>
</html>
